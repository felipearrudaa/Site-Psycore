<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Profissional - PSYCORE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style2.css">
</head>

<body>

<header>
    <img src="logo.png" alt="Logo da PSYCORE" class="logo-header">
    <h1>PSYCORE</h1>
    <p>Cadastro de Profissional</p>
</header>

<nav>
    <a href="index.html">Início</a>
    <a href="Equipe.html">Equipe</a>
    <a href="atendimento.html">Atendimento</a>
</nav>

<section>
    <h2>Cadastro de Profissional</h2>

    <p class="texto-info">
        Preencha o formulário abaixo para se cadastrar como profissional parceiro da PSYCORE.
        Suas informações serão analisadas pela equipe.
    </p>

    <form action="https://api.web3forms.com/submit" method="POST">

        <input type="hidden" name="access_key" value="6881028a-78e0-44c8-b0fd-b67c6ea18504">
        <input type="hidden" name="subject" value="Novo cadastro de profissional - PSYCORE">
        <input type="hidden" name="redirect" value="https://felipearrudaa.github.io/Site-Psycore/obrigado.html">

        <label>Nome completo</label>
        <input type="text" name="nome_profissional" required>

        <label>Email profissional</label>
        <input type="email" name="email_profissional" required>

        <label>Telefone para contato</label>
        <input type="tel" name="telefone" required>

        <label>Área de atuação</label>
        <select name="area_atuacao" required>
            <option value="">Selecione</option>
            <option>Psicologia</option>
            <option>Psicanálise</option>
            <option>Terapia</option>
            <option>Psiquiatria</option>
            <option>Assistência social</option>
            <option>Outro</option>
        </select>

        <label>Registro profissional / CRP</label>
        <input type="text" name="registro_profissional" placeholder="Ex: CRP 00/00000" required>

        <label>Tempo de experiência</label>
        <select name="experiencia" required>
            <option value="">Selecione</option>
            <option>Menos de 1 ano</option>
            <option>1 a 3 anos</option>
            <option>3 a 5 anos</option>
            <option>Mais de 5 anos</option>
        </select>

        <label>Tipo de atendimento oferecido</label>
        <select name="tipo_atendimento" required>
            <option value="">Selecione</option>
            <option>Online</option>
            <option>Presencial</option>
            <option>Online e presencial</option>
        </select>

        <label>Especialidades</label>
        <textarea name="especialidades" rows="4" placeholder="Ex: ansiedade, depressão, luto, dependência química..." required></textarea>

        <label>Mensagem adicional</label>
        <textarea name="mensagem" rows="5"></textarea>

        <button type="submit">Enviar Cadastro</button>
    </form>
</section>

<footer>
    <p>© 2026 PSYCORE</p>
</footer>

</body>

</html>
